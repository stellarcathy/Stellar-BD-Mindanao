<!--
STELLAR BD MINDANAO APP V26 — PHOTO CAPTION FIX
Use this patch with the working V25 application.

Changes:
1. Center photo captions for Admin and Viewer.
2. Do not display "No caption added."
3. Completely hide the caption area when the caption is blank.
4. Does not modify Supabase authentication, database, reports, pipeline, or other V25 functions.

IMPORTANT:
This file is a patch, not a replacement for the complete V25 application.
To create the complete V26 file without changing anything else in V25,
insert this script immediately before the closing </body> tag of V25.
-->

<script>
(function () {
  "use strict";

  /* V26 — caption alignment and blank-caption behavior */
  const style = document.createElement("style");
  style.id = "v26-photo-caption-fix";
  style.textContent = `
    .photo-caption {
      text-align: center !important;
    }

    .photo-viewer-caption {
      text-align: center !important;
    }

    .photo-viewer-caption.empty-caption {
      display: none !important;
    }
  `;

  if (!document.getElementById("v26-photo-caption-fix")) {
    document.head.appendChild(style);
  }

  /*
   * V25 creates viewer captions dynamically and currently uses:
   *   caption.textContent = text || "No caption added.";
   *   if(!text) caption.classList.add("empty-caption");
   *
   * Rather than overriding Element.prototype.appendChild globally,
   * observe only the report gallery and clean the generated caption.
   */
  function cleanCaptions(root) {
    if (!root) return;

    root.querySelectorAll(".photo-viewer-caption").forEach(function (caption) {
      const text = (caption.textContent || "").trim();

      if (!text || text === "No caption added.") {
        caption.textContent = "";
        caption.classList.add("empty-caption");
      } else {
        caption.classList.remove("empty-caption");
        caption.style.textAlign = "center";
      }
    });
  }

  function startObserver() {
    const gallery = document.getElementById("week1Gallery");
    if (!gallery) return false;

    cleanCaptions(gallery);

    if (!gallery.__v26CaptionObserver) {
      const observer = new MutationObserver(function () {
        cleanCaptions(gallery);
      });

      observer.observe(gallery, {
        childList: true,
        subtree: true,
        characterData: true
      });

      gallery.__v26CaptionObserver = observer;
    }

    return true;
  }

  if (!startObserver()) {
    const pageObserver = new MutationObserver(function () {
      if (startObserver()) pageObserver.disconnect();
    });

    pageObserver.observe(document.body, {
      childList: true,
      subtree: true
    });
  }
})();
</script>
