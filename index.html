<style id="v27-repaired-product-css">
.v27-product-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
.v27-product-tab{border:1px solid #d9e8df;background:#fff;color:#315347;border-radius:9px;padding:8px 12px;font-size:11px;font-weight:800;cursor:pointer}
.v27-product-tab.active{background:#08783f;color:#fff;border-color:#08783f}
.v27-product-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.v27-product-summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.v27-product-card{background:#fff;border:1px solid #d9e8df;border-radius:10px;padding:12px;cursor:pointer}
.v27-product-card.active{border-color:#08783f;box-shadow:0 0 0 2px rgba(8,120,63,.08)}
.v27-product-name{font-size:11px;font-weight:800}
.v27-product-count{font-size:24px;font-weight:850;margin-top:5px;color:#16352a}
.v27-company-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.v27-company-item{background:#fff;border:1px solid #e0ebe5;border-radius:10px;padding:11px;cursor:pointer}
.v27-company-item:hover{border-color:#08783f}
.v27-company-products{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.v27-product-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:999px;font-size:9px;font-weight:800;border:1px solid #d9e8df;background:#f8fcfa}
.v27-map-filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.v27-map-filter select{border:1px solid #d9e8df;border-radius:8px;padding:7px 9px;background:#fff}
.v27-map-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:10px;color:#51665d;margin:7px 0 10px}
.v27-map-legend span{display:inline-flex;align-items:center;gap:4px}
.v27-map-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.v27-product-empty{padding:18px;text-align:center;color:#6b7d74;border:1px dashed #cbded4;border-radius:10px}
@media(max-width:900px){
  .v27-product-summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  .v27-company-list{grid-template-columns:1fr}
}
@media(max-width:600px){.v27-product-summary{grid-template-columns:1fr}}
</style>

<script id="v27-repaired-product-patch">
(function(){
  "use strict";

  if (window.__STELLAR_BD_V27_REPAIRED__) return;
  window.__STELLAR_BD_V27_REPAIRED__ = true;

  const PRODUCTS = {
    corn:   {name:"Commercial Corn", color:"#f2c400", icon:"🌽"},
    coffee: {name:"Coffee",          color:"#111111", icon:"☕"},
    cacao:  {name:"Cacao",           color:"#7a4b2a", icon:"🍫"},
    pepper: {name:"Pepper",          color:"#f28c18", icon:"🌶️"},
    ube:    {name:"Ube",             color:"#7a3db8", icon:"🍠"}
  };

  let selectedProduct = "all";
  let dashboardObserver = null;
  let dashboardRefreshTimer = null;

  function esc(value){
    return String(value == null ? "" : value).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function productKeys(company){
    if (!company) return [];

    const raw = [
      company.commodity,
      company.commodities,
      company.product
    ].filter(Boolean).join(" ").toLowerCase();

    const keys = [];

    if (/\bcorn\b|feed[-\s]*grade|wet\s+corn|corn\s+cob/.test(raw)) keys.push("corn");
    if (/\bcoffee\b/.test(raw)) keys.push("coffee");
    if (/\bcacao\b|\bcocoa\b/.test(raw)) keys.push("cacao");
    if (/\bpepper\b/.test(raw)) keys.push("pepper");
    if (/\bube\b|\bpurple\s+yam\b/.test(raw)) keys.push("ube");

    return [...new Set(keys)];
  }

  function getCompanies(){
    return Array.isArray(window.companies) ? window.companies : [];
  }

  function companiesFor(key){
    const list = getCompanies();
    if (key === "all") return list;
    return list.filter(function(c){ return productKeys(c).includes(key); });
  }

  function companyByMarker(marker){
    const pos = marker && marker.getLatLng ? marker.getLatLng() : null;
    if (!pos) return null;

    return getCompanies().find(function(c){
      const lat = Number(c.lat);
      const lon = Number(c.lon);
      return Number.isFinite(lat) && Number.isFinite(lon) &&
        Math.abs(lat - Number(pos.lat)) < 0.00001 &&
        Math.abs(lon - Number(pos.lng)) < 0.00001;
    }) || null;
  }

  function pinIcon(keys){
    const colors = (keys || []).map(function(k){
      return PRODUCTS[k] && PRODUCTS[k].color;
    }).filter(Boolean);

    const background = colors.length === 1
      ? colors[0]
      : colors.length > 1
        ? "conic-gradient(" + colors.map(function(c,i){
            const a = (i * 100 / colors.length);
            const b = ((i + 1) * 100 / colors.length);
            return c + " " + a + "% " + b + "%";
          }).join(",") + ")"
        : "#9aa9a2";

    return L.divIcon({
      className:"",
      html:
        '<div style="width:22px;height:22px;border-radius:50% 50% 50% 0;' +
        'transform:rotate(-45deg);background:'+background+';' +
        'border:3px solid #fff;box-shadow:0 2px 5px #777;">' +
        '<span style="display:block;width:6px;height:6px;background:#fff;' +
        'border-radius:50%;margin:5px auto;"></span></div>',
      iconSize:[22,22],
      iconAnchor:[11,21]
    });
  }

  function applyMapProductFilter(){
    if (!window.map || !Array.isArray(window.markers)) return;

    window.markers.forEach(function(marker){
      const company = companyByMarker(marker);
      const keys = company ? productKeys(company) : [];

      if (
        selectedProduct !== "all" &&
        !keys.includes(selectedProduct)
      ){
        if (window.map.hasLayer(marker)) {
          window.map.removeLayer(marker);
        }
        return;
      }

      if (!window.map.hasLayer(marker)) {
        marker.addTo(window.map);
      }

      const displayKeys =
        selectedProduct === "all" ? keys : [selectedProduct];

      if (marker.setIcon) {
        marker.setIcon(pinIcon(displayKeys));
      }
    });
  }

  /*
   * SAFE WRAPPER:
   * The original V26/V25 refreshMap is called first.
   * We never call the wrapper from inside itself.
   */
  function wrapMapRefresh(){
    if (
      typeof window.refreshMap !== "function" ||
      window.refreshMap.__v27Wrapped
    ) return;

    const baseRefreshMap = window.refreshMap;

    function wrappedRefreshMap(){
      const result = baseRefreshMap.apply(this, arguments);

      try {
        applyMapProductFilter();
      } catch(e) {
        console.error("V27 map styling error:", e);
      }

      return result;
    }

    wrappedRefreshMap.__v27Wrapped = true;
    wrappedRefreshMap.__v27Original = baseRefreshMap;
    window.refreshMap = wrappedRefreshMap;
  }

  function refreshBaseMap(){
    try {
      if (typeof window.refreshMap === "function") {
        window.refreshMap();
      }
    } catch(e) {
      console.error("V27 map refresh error:", e);
    }
  }

  function installDashboard(){
    const dashboard = document.getElementById("dashboard");
    if (!dashboard) return null;

    let panel = document.getElementById("v27ProductDashboard");

    if (!panel){
      panel = document.createElement("div");
      panel.id = "v27ProductDashboard";
      panel.className = "panel";
      panel.style.marginTop = "13px";
      panel.innerHTML =
        '<div class="panel-title">🌾 Crop / Product Development</div>' +
        '<div id="v27ProductTabs" class="v27-product-tabs"></div>' +
        '<div id="v27ProductSummary" class="v27-product-summary"></div>' +
        '<div id="v27ProductCompanies" class="v27-company-list"></div>';
      dashboard.appendChild(panel);
    }

    return panel;
  }

  function renderDashboard(){
    const panel = installDashboard();
    if (!panel) return;

    const tabs = document.getElementById("v27ProductTabs");
    const summary = document.getElementById("v27ProductSummary");
    const list = document.getElementById("v27ProductCompanies");

    if (!tabs || !summary || !list) return;

    tabs.innerHTML =
      '<button type="button" class="v27-product-tab ' +
      (selectedProduct === "all" ? "active" : "") +
      '" data-v27-product="all">All Products</button>' +
      Object.keys(PRODUCTS).map(function(key){
        const p = PRODUCTS[key];
        return '<button type="button" class="v27-product-tab ' +
          (selectedProduct === key ? "active" : "") +
          '" data-v27-product="'+key+'">' +
          '<span class="v27-product-dot" style="background:'+p.color+'"></span>' +
          p.icon + ' ' + esc(p.name) +
          '</button>';
      }).join("");

    tabs.querySelectorAll("[data-v27-product]").forEach(function(btn){
      btn.addEventListener("click",function(){
        selectedProduct = this.getAttribute("data-v27-product");

        const select = document.getElementById("v27MapProductSelect");
        if (select) select.value = selectedProduct;

        renderDashboard();
        refreshBaseMap();
      });
    });

    summary.innerHTML = Object.keys(PRODUCTS).map(function(key){
      const p = PRODUCTS[key];
      const count = companiesFor(key).length;

      return '<div class="v27-product-card ' +
        (selectedProduct === key ? "active" : "") +
        '" data-v27-card="'+key+'">' +
        '<div class="v27-product-name">' +
        '<span class="v27-product-dot" style="background:'+p.color+'"></span>' +
        p.icon + ' ' + esc(p.name) +
        '</div>' +
        '<div class="v27-product-count">'+count+'</div>' +
        '<div style="font-size:9px;color:#6b7d74">Companies / organizations</div>' +
        '</div>';
    }).join("");

    summary.querySelectorAll("[data-v27-card]").forEach(function(card){
      card.addEventListener("click",function(){
        selectedProduct = this.getAttribute("data-v27-card");

        const select = document.getElementById("v27MapProductSelect");
        if (select) select.value = selectedProduct;

        renderDashboard();
        refreshBaseMap();
      });
    });

    const rows = companiesFor(selectedProduct);

    if (!rows.length){
      list.innerHTML =
        '<div class="v27-product-empty" style="grid-column:1/-1">' +
        'No companies are currently tagged under this product.' +
        '</div>';
      return;
    }

    list.innerHTML = rows.map(function(company){
      const keys = productKeys(company);

      return '<div class="v27-company-item" data-v27-company="' +
        esc(company.id || "") + '">' +
        '<b>'+esc(company.name || "")+'</b>' +
        '<div style="font-size:10px;color:#6b7d74;margin-top:3px">' +
        esc(company.type || "") +
        (company.location ? ' • '+esc(company.location) : '') +
        '</div>' +
        '<div class="v27-company-products">' +
        keys.map(function(key){
          const p = PRODUCTS[key];
          return '<span class="v27-product-chip">' +
            '<span class="v27-product-dot" style="background:'+p.color+'"></span>' +
            esc(p.name) +
            '</span>';
        }).join("") +
        '</div>' +
        '<div style="font-size:10px;margin-top:7px">' +
        '<b>Status:</b> '+esc(company.status || "") +
        (company.volume ? ' &nbsp; <b>Volume:</b> '+esc(company.volume) : '') +
        '</div>' +
        '</div>';
    }).join("");

    list.querySelectorAll("[data-v27-company]").forEach(function(item){
      item.addEventListener("click",function(){
        const id = this.getAttribute("data-v27-company");
        const company = getCompanies().find(function(c){
          return String(c.id || "") === String(id);
        });

        if (!company) return;

        if (typeof window.showDetail === "function"){
          window.showDetail(company);
        }

        if (
          window.map &&
          Number.isFinite(Number(company.lat)) &&
          Number.isFinite(Number(company.lon))
        ){
          window.map.setView(
            [Number(company.lat), Number(company.lon)],
            11
          );
        }
      });
    });
  }

  function installMapControls(){
    const mapSection = document.getElementById("map");
    if (!mapSection) return;

    if (document.getElementById("v27MapProductFilter")) return;

    const panel = mapSection.querySelector(".panel");
    if (!panel) return;

    const filter = document.createElement("div");
    filter.id = "v27MapProductFilter";
    filter.className = "v27-map-filter";

    filter.innerHTML =
      '<label style="font-size:10px;font-weight:800;color:#51665d">Product:</label>' +
      '<select id="v27MapProductSelect">' +
      '<option value="all">All Products</option>' +
      '<option value="corn">Commercial Corn</option>' +
      '<option value="coffee">Coffee</option>' +
      '<option value="cacao">Cacao</option>' +
      '<option value="pepper">Pepper</option>' +
      '<option value="ube">Ube</option>' +
      '</select>';

    const title = panel.querySelector(".panel-title");

    if (title) {
      title.insertAdjacentElement("afterend", filter);
    } else {
      panel.prepend(filter);
    }

    const legend = document.createElement("div");
    legend.className = "v27-map-legend";

    legend.innerHTML = Object.keys(PRODUCTS).map(function(key){
      const p = PRODUCTS[key];
      return '<span><i style="background:'+p.color+'"></i>' +
        esc(p.name) + '</span>';
    }).join("");

    filter.insertAdjacentElement("afterend", legend);

    const select = document.getElementById("v27MapProductSelect");

    if (select){
      select.value = selectedProduct;

      select.addEventListener("change",function(){
        selectedProduct = this.value;
        renderDashboard();
        refreshBaseMap();
      });
    }
  }

  function init(){
    wrapMapRefresh();
    installDashboard();
    installMapControls();
    renderDashboard();
    applyMapProductFilter();
  }

  /*
   * Wait for the existing V25/V26 app to create its authenticated
   * dashboard/map. This observer disconnects as soon as those elements
   * exist, so it cannot loop forever.
   */
  function watchForApp(){
    if (!document.body || dashboardObserver) return;

    dashboardObserver = new MutationObserver(function(){
      const dashboard = document.getElementById("dashboard");

      if (dashboard){
        if (dashboardRefreshTimer) clearTimeout(dashboardRefreshTimer);

        dashboardRefreshTimer = setTimeout(function(){
          init();
        },50);
      }
    });

    dashboardObserver.observe(document.body,{
      childList:true,
      subtree:true
    });

    const dashboard = document.getElementById("dashboard");
    if (dashboard) init();
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded",watchForApp,{once:true});
  } else {
    watchForApp();
  }

  /*
   * Keep the base app safe if its render() function rebuilds #dashboard.
   * This timer is intentionally limited and only runs while the page is open.
   */
  setTimeout(function(){
    try { init(); } catch(e) {
      console.error("V27 initialization:",e);
    }
  },1500);

})();
</script>
