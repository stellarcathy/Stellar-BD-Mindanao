<!-- BUSINESS DEVELOPMENT APP V26 - PHOTO CAPTION FIX
     Apply this small patch to Stellar_BD_Mindanao_App_V25.html.
     It only changes photo caption display/editing behavior.
-->

<script>
/* V26 PHOTO CAPTION FIX
   1. Center captions.
   2. Hide captions completely when blank.
   3. Remove "No caption added."
*/
(function () {
  const style = document.createElement("style");
  style.textContent = `
    .photo-caption {
      text-align: center !important;
    }
    .photo-viewer-caption {
      text-align: center !important;
    }
    .photo-viewer-caption.empty-caption {
      display: none !important;
    }
  `;
  document.head.appendChild(style);

  // Remove the old placeholder text and hide empty viewer captions.
  const originalAppend = Element.prototype.appendChild;
  Element.prototype.appendChild = function (node) {
    if (
      node &&
      node.classList &&
      node.classList.contains("photo-viewer-caption")
    ) {
      const text = (node.textContent || "").trim();
      if (text === "No caption added.") {
        node.textContent = "";
        node.classList.add("empty-caption");
      }
    }
    return originalAppend.call(this, node);
  };
})();
</script>
